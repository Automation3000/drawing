	<script>
        // Comprehensive branding and UI cleanup script
        var cleanupInterval = setInterval(function() {
            var logo = document.querySelector('.geAppIcon');
            if (logo) {
                // Update logo href and title
                logo.setAttribute('href', 'https://draw.automation3000.com');
                logo.setAttribute('title', 'Drawing');
                
                // Ensure background-image override is applied with orange icon
                logo.style.backgroundImage = 'url(\'data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz48c3ZnIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgdmlld0JveD0iMCAwIDEwMCAxMDAiPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjUwIiBmaWxsPSIjZjU3YzAwIi8+PHBhdGggZD0iTTUwLDIwTDgwLDgwSDIwWiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==\')';
            }
            
            // Hide Files menu items and buttons
            var filesItems = document.querySelectorAll('[title*="Files"], [title*="File"], .geMenuItem[data-action*="file"]');
            filesItems.forEach(function(item) {
                item.style.display = 'none';
            });
            
            // Hide any element with "Files" text content
            var allElements = document.querySelectorAll('[title*="Files"], [title*="File"]');
            allElements.forEach(function(el) {
                if (el.textContent && (el.textContent.includes('Files') || el.textContent.includes('File'))) {
                    el.style.display = 'none';
                }
            });
        }, 500);
        
        // Hide Share button as fallback
        var shareBtn = document.querySelector('.geBtn.gePrimaryBtn[title="Share"]');
        if(shareBtn) { shareBtn.style.display = 'none'; }
        
        // Stop the interval after 30 seconds to avoid continuous polling
        setTimeout(function() { clearInterval(cleanupInterval); }, 30000);
    </script>

	<style type="text/css">
		.geBlock {
			z-index:-3;
			margin:100px;
			margin-top:40px;
			margin-bottom:30px;
			padding:20px;
			text-align:center;
			min-width:50%;
		}
		.geBlock h1, .geBlock h2 {
			margin-top:0px;
			padding-top:0px;
		}

        /* ----- LOGO AND BRANDING OVERRIDES ----- */
        
        /* Replace draw.io logo with custom orange diagram icon */
        .geAppIcon {
            background-image: url('data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz48c3ZnIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgdmlld0JveD0iMCAwIDEwMCAxMDAiPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjUwIiBmaWxsPSIjZjU3YzAwIi8+PHBhdGggZD0iTTUwLDIwTDgwLDgwSDIwWiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==') !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
        }

        /* Hide draw.io branding elements in header/title bars */
        div[title*="draw.io"],
        span[title*="draw.io"] {
            display: none !important;
        }

        /* ----- HIDE UNWANTED MENUS AND BUTTONS ----- */
        
        /* Hide Top Share Button */
        .geBtn.gePrimaryBtn[title="Share"],
        .geBtn[title="Share"] {
            display: none !important;
        }
        
        /* Hide Cloud/Online options from all dropdowns based on text/class */
        .geMenuItem[title="Google Drive..."],
        .geMenuItem[title="OneDrive..."],
        .geMenuItem[title="Microsoft 365..."],
        .geMenuItem[title="Dropbox..."],
        .geMenuItem[title="GitHub..."],
        .geMenuItem[title="GitLab..."],
        .geMenuItem[title="Trello..."] {
            display: none !important;
        }

        /* Hide the Share option from File Menu */
        .geMenuItem[title="Share..."] {
            display: none !important;
        }

        /* Hide generic "More" links in File menu that might contain online options  */
        .geMenuItem[data-action="export"],
        .geMenuItem[id*="Share"] {
            display: none !important;
        }

        /* ----- HIDE FILES OPTION AND RELATED MENUS ----- */
        
        /* Hide Files menu item by title and text content */
        .geMenuItem[title*="Files"],
        .geMenuItem[title*="File"],
        div[title*="Files"],
        span[title*="Files"],
        button[title*="Files"] {
            display: none !important;
        }

        /* Hide any menu items that might contain file operations */
        .geMenuItem[data-action*="file"],
        .geMenuItem[data-action*="import"],
        .geMenuItem[data-action*="open"] {
            display: none !important;
        }

        /* Alternative selectors for Files menu */
        .geName[title*="Files"],
        .geName[title*="File"],
        .geLabel[title*="Files"],
        div:has-text("Files") {
            display: none !important;
        }

	</style>
</head>

		</p>
	</div>
</div>
<script src="js/main.js"></script>

</html>
